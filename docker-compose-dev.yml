version: '3.8'

services:
  redis:
    container_name: redis-container
    build:
      context: .
      dockerfile: Dockerfile.redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - app-network

  postgres:
    image: bitnami/postgresql:latest
    container_name: pg-master
    ports:
      - '5432:5432'
    environment:
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=12345678
      - POSTGRESQL_DATABASE=postgres
      - ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - pg_master_data:/bitnami/postgresql
    networks:
      - app-network

  mongo:
    image: mongo:4.4
    container_name: mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  elasticsearch:
    image: elasticsearch:7.17.10
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
    networks:
      - app-network

  fluentd:
    image: ducthong12/fluentd-es:latest
    container_name: fluentd
    volumes:
      - ./infrastructure/fluentd/fluent.conf:/fluentd/etc/fluent.conf:ro
      - ./logs:/fluentd/log/elastic-buffer
    ports:
      - '24224:24224'
      - '24224:24224/udp'
    user: root
    depends_on:
      - elasticsearch
    networks:
      - app-network

  kibana:
    image: kibana:7.17.10
    container_name: kibana
    ports:
      - '5601:5601'
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - app-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - '16686:16686'
      - '4317:4317'
      - '4318:4318'
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/targets.json:/etc/prometheus/targets.json:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - '3111:3111'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_HTTP_PORT=3111
    depends_on:
      - prometheus
      - jaeger
    networks:
      - app-network

  kafka:
    image: apache/kafka:latest
    container_name: kafka-kraft
    ports:
      - '9092:9092' # Port cho Host (NestJS bên ngoài)
    environment:
      # --- CẤU HÌNH KRAFT (KHÔNG CẦN ZOOKEEPER) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'

      # --- CẤU HÌNH MẠNG (QUAN TRỌNG) ---
      # Định nghĩa 3 loại Listener:
      # 1. CONTROLLER: Giao tiếp nội bộ controller
      # 2. INTERNAL: Giao tiếp trong mạng Docker (Kafka UI, Microservices in Docker)
      # 3. EXTERNAL: Giao tiếp với máy Host (NestJS chạy local)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'

      # Lắng nghe ở đâu?
      KAFKA_LISTENERS: 'INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093'

      # Quảng bá địa chỉ nào cho Client?
      # - Nếu Client ở trong Docker (Kafka UI) -> Hãy gọi 'kafka:29092'
      # - Nếu Client ở ngoài (NestJS local) -> Hãy gọi 'localhost:9092'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:29092,EXTERNAL://localhost:9092'

      # Listener nào dùng để giao tiếp giữa các Broker (nếu có cluster)
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - app-network
  connect:
    image: debezium/connect:2.5
    container_name: kafka_connect
    ports:
      - '8083:8083'
    environment:
      - BOOTSTRAP_SERVERS=kafka:29092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
      - KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - app-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kraft
      # Kafka UI nằm chung mạng Docker nên dùng port INTERNAL (29092)
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
    networks:
      - app-network

  # ----------------------------------------------------------------
  # 1. API GATEWAY
  # ----------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: api-gateway
    ports:
      - '3333:3333'
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_started
      mongo:
        condition: service_started
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
      jaeger:
        condition: service_started
      prometheus:
        condition: service_started
      kafka:
        condition: service_healthy
    logging:
      driver: 'fluentd'
      options:
        fluentd-address: 'host.docker.internal:24224'
        tag: 'service.api-gateway'
        fluentd-async: 'true'
        mode: non-blocking
        fluentd-buffer-limit: '10MB'
    networks:
      - app-network

  # ----------------------------------------------------------------
  # 2. USER SERVICE
  # ----------------------------------------------------------------
  user:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: user
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    logging:
      driver: fluentd
      options:
        fluentd-address: 'fluentd:24224'
        tag: 'service.user'
        fluentd-async: 'true'
        fluentd-buffer-limit: '10MB'
    networks:
      - app-network

  # ----------------------------------------------------------------
  # 3. PRODUCT SERVICE
  # ----------------------------------------------------------------
  product:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: product
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
      kafka:
        condition: service_healthy
    logging:
      driver: fluentd
      options:
        fluentd-address: 'fluentd:24224'
        tag: 'service.product'
        fluentd-async: 'true'
        fluentd-buffer-limit: '10MB'
    networks:
      - app-network

  # ----------------------------------------------------------------
  # 4. ORDER SERVICE
  # ----------------------------------------------------------------
  order:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: order
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    logging:
      driver: fluentd
      options:
        fluentd-address: 'fluentd:24224'
        tag: 'service.order'
        fluentd-async: 'true'
        fluentd-buffer-limit: '10MB'
    networks:
      - app-network

  # ----------------------------------------------------------------
  # 5. INVENTORY SERVICE
  # ----------------------------------------------------------------
  inventory:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: inventory
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    logging:
      driver: fluentd
      options:
        fluentd-address: 'fluentd:24224'
        tag: 'service.inventory'
        fluentd-async: 'true'
        fluentd-buffer-limit: '10MB'
    networks:
      - app-network

  # ----------------------------------------------------------------
  # 6. PAYMENT SERVICE
  # ----------------------------------------------------------------
  payment:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: payment
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    logging:
      driver: fluentd
      options:
        fluentd-address: 'fluentd:24224'
        tag: 'service.payment'
        fluentd-async: 'true'
        fluentd-buffer-limit: '10MB'
    networks:
      - app-network

  # ----------------------------------------------------------------
  # 7. SEARCH SERVICE
  # ----------------------------------------------------------------
  search:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: search
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
      kafka:
        condition: service_healthy
    logging:
      driver: fluentd
      options:
        fluentd-address: 'fluentd:24224'
        tag: 'service.search'
        fluentd-async: 'true'
        fluentd-buffer-limit: '10MB'
    networks:
      - app-network
networks:
  app-network:
    driver: bridge

volumes:
  redis_data:
  pg_master_data:
  mongo_data:
