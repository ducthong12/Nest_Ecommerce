version: '3.8'

networks:
  app-network:
    external: true
    name: Docker-Network

services:
  # ----------------------------------------------------------------
  # 1. API GATEWAY
  # ----------------------------------------------------------------
  api-gateway:
    image: ${DOCKER_USERNAME}/api-gateway:latest
    ports:
      - '${API_GATEWAY_PORT}:3000'
    env_file:
      - .env
    networks:
      - app-network
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
    logging:
      driver: 'fluentd'
      options:
        # Fluentd chạy global nên mỗi node đều có port 24224
        fluentd-address: '127.0.0.1:24224'
        # Đặt tag để biết log này của thằng nào (Quan trọng để filter)
        tag: 'service.api-gateway'
        # Bắt buộc: Để nếu Fluentd chết, App vẫn chạy tiếp (không bị treo)
        fluentd-async: 'true'
        # Giới hạn bộ nhớ đệm log để không ăn hết RAM nếu mất mạng
        fluentd-buffer-limit: '10MB'

  # ----------------------------------------------------------------
  # 2. USER SERVICE
