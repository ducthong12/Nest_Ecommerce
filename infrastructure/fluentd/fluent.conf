<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<match service.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  
  # Cấu hình tối ưu cho ES 7.x
  sniffing false
  type_name _doc
  suppress_type_name true
  
  logstash_format true
  logstash_prefix microservice-logs
  
  <buffer>
    @type file
    # Đường dẫn này phải nằm trong thư mục đã mount ở bước 1
    path /fluentd/log/elastic-buffer/fluentd.buffer
    flush_thread_count 2
    flush_interval 5s
    retry_type exponential_backoff
    retry_max_interval 30s
  </buffer>
</match>
