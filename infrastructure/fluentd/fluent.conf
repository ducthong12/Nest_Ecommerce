<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<match **>
  @type elasticsearch
  host infra_elasticsearch   # Tên service Elastic trong mạng Swarm
  port 9200
  logstash_format true
  logstash_prefix microservices
  logstash_dateformat %Y%m%d
  include_tag_key true
  type_name access_log
  tag_key @log_name
  flush_interval 1s
</match>
