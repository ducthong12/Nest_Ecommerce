<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<match **>
  @type elasticsearch
  host "infra_elasticsearch"
  port 9200
  scheme http
  
  reload_connections false   # Quan trọng: Tắt tính năng tự tìm node, cứ gửi vào VIP của Swarm
  reload_on_failure false    # Không reload lại kết nối khi lỗi
  reconnect_on_error true    # Chỉ đơn giản là kết nối lại
  request_timeout 60s        # Tăng thời gian chờ lên 60s (cho máy yếu)
  
  # Định dạng log
  logstash_format true
  logstash_prefix "microservices"
  logstash_dateformat "%Y%m%d"
  include_tag_key true
  type_name "access_log"
  tag_key "@log_name"

  <buffer>
    @type file
    path /fluentd/log/buffer/  # Lưu tạm ra file để không mất log nếu RAM đầy
    flush_interval 5s          # Gom 5s mới bắn 1 lần (đỡ áp lực cho ES)
    chunk_limit_size 2M        # Mỗi lần bắn tối đa 2MB
    retry_max_interval 30
    retry_forever true         # Thử lại mãi mãi
    flush_thread_count 2       # Dùng 2 luồng để bắn
  </buffer>
</match>
